<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerar ícones PNG — Do It Better</title>
  <style>
    body { margin: 0; padding: 24px; font-family: -apple-system, system-ui, sans-serif; background: #070a14; color: #f1f5f9; }
    h1 { font-size: 22px; }
    p { color: #a3aec2; max-width: 560px; }
    .grade { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    canvas { border-radius: 18%; box-shadow: 0 8px 30px rgba(124, 58, 237, .35); max-width: 160px; height: auto; }
    a { color: #fff; background: linear-gradient(135deg, #7c3aed, #06b6d4); padding: 10px 16px; border-radius: 12px; text-decoration: none; font-weight: 700; }
    textarea { width: 100%; max-width: 560px; height: 120px; background: #111827; color: #e5e7eb; border-radius: 12px; border: 1px solid #334155; padding: 10px; font-family: monospace; }
  </style>
</head>
<body>
  <!--
    Ferramenta opcional: converte icons/icon.svg em PNG direto no navegador.
    Abra este arquivo pelo site (ex.: https://SEU-USUARIO.github.io/do-it-better/ferramentas/gerar-icones.html)
    ou rode um servidor local na pasta do projeto. Toque em cada botão para baixar.
    Se você editar o SVG, cole o código novo na caixa e toque em "Redesenhar".
  -->
  <h1>Gerar ícones PNG</h1>
  <p>Converte <code>icons/icon.svg</code> em PNG nos tamanhos usados pelo app. Baixe e coloque os arquivos na pasta <code>icons/</code> com estes nomes exatos.</p>
  <textarea id="svg" placeholder="Carregando icons/icon.svg..."></textarea><br><br>
  <button id="redesenhar">Redesenhar</button>
  <div class="grade" id="grade"></div>

  <script>
    const TAMANHOS = [
      ['apple-touch-icon.png', 180],
      ['icon-192.png', 192],
      ['icon-512.png', 512],
      ['icon-maskable-512.png', 512],
    ];

    async function desenhar(svgTexto) {
      const grade = document.getElementById('grade');
      grade.innerHTML = '';
      const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgTexto);
      const img = new Image();
      img.src = url;
      await img.decode();
      for (const [nome, tam] of TAMANHOS) {
        const c = document.createElement('canvas');
        c.width = tam;
        c.height = tam;
        c.getContext('2d').drawImage(img, 0, 0, tam, tam);
        const link = document.createElement('a');
        link.download = nome;
        link.href = c.toDataURL('image/png');
        link.textContent = `Baixar ${nome} (${tam}×${tam})`;
        const box = document.createElement('div');
        box.className = 'item';
        box.append(c, link);
        grade.append(box);
      }
    }

    fetch('../icons/icon.svg')
      .then((r) => r.text())
      .then((t) => {
        document.getElementById('svg').value = t;
        desenhar(t);
      })
      .catch(() => (document.getElementById('svg').placeholder = 'Não consegui carregar o SVG. Cole o código dele aqui.'));

    document.getElementById('redesenhar').onclick = () => desenhar(document.getElementById('svg').value);
  </script>
</body>
</html>
