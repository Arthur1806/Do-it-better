<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ícone do Do It Better: check estilizado dentro de um anel de XP,
       gradiente roxo -> ciano sobre fundo escuro. Quadrado inteiro
       (o iPhone arredonda os cantos sozinho). Conteúdo dentro da área
       segura de 80%, então também serve como ícone "maskable". -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="fundo" cx="0.3" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#1E1548"/>
      <stop offset="0.55" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#05070F"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="brilho" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#fundo)"/>
  <circle cx="256" cy="256" r="200" fill="url(#halo)"/>
  <!-- trilho do anel -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="30"/>
  <!-- anel de progresso (75%) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#g)" stroke-width="30" stroke-linecap="round"
          stroke-dasharray="707 943" transform="rotate(-90 256 256)" filter="url(#brilho)"/>
  <!-- check -->
  <path d="M184 262 L236 314 L334 208" fill="none" stroke="url(#g)" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#brilho)"/>
  <!-- faísca -->
  <circle cx="150" cy="150" r="11" fill="#22D3EE" filter="url(#brilho)"/>
</svg>
